  </defs>
  <!-- Graceful twilight branch & breeze trail -->
  <path d="M 8 28 Q 52 10 118 24" stroke="url(#skBranch)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 22 32 Q 66 18 108 29" stroke="#c7d2fe" stroke-width="0.85" stroke-dasharray="3 3" opacity="0.65"/>
