    <path d="M 0 -2 C -3 -9, -2 -13, 0 -11.5 C 2 -13, 3 -9, 0 -2 Z" transform="rotate(216)" fill="url(#skBlossom)"/>
    <path d="M 0 -2 C -3 -9, -2 -13, 0 -11.5 C 2 -13, 3 -9, 0 -2 Z" transform="rotate(288)" fill="url(#skBlossom)"/>
    <circle cx="0" cy="0" r="2.4" fill="#fb7185"/>
