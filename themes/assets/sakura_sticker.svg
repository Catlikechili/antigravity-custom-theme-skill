    <path d="M 0 -2 C -3 -9, -2 -13, 0 -11.5 C 2 -13, 3 -9, 0 -2 Z" transform="rotate(216)" fill="#fda4af"/>
    <path d="M 0 -2 C -3 -9, -2 -13, 0 -11.5 C 2 -13, 3 -9, 0 -2 Z" transform="rotate(288)" fill="#ffe4e6"/>
