      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.88"/>
      <stop offset="75%" stop-color="#fb7185" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fda4af" stop-opacity="0.2"/>
