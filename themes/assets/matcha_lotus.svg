<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 40" fill="none">
  <defs>
    <linearGradient id="mzRipple" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="30%" stop-color="#10b981" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="mzPetal" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="55%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="mzGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <!-- Zen pond ripple arcs -->
  <path d="M 8 30 Q 64 22 120 30" stroke="url(#mzRipple)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 24 34 Q 64 28 104 34" stroke="#d97706" stroke-width="0.95" stroke-dasharray="4 3" opacity="0.7"/>
  <!-- Left & right matcha tea leaves -->
  <path d="M 26 27 C 31 19, 41 18, 47 25 C 40 28, 32 29, 26 27 Z" fill="#10b981" opacity="0.85" stroke="#047857" stroke-width="0.9"/>
  <path d="M 102 27 C 97 19, 87 18, 81 25 C 88 28, 96 29, 102 27 Z" fill="#10b981" opacity="0.85" stroke="#047857" stroke-width="0.9"/>
  <!-- Outer Lotus Petals -->
  <path d="M 64 27 C 50 27, 45 19, 48 13 C 54 15, 60 20, 64 27 Z" fill="url(#mzPetal)" stroke="#047857" stroke-width="1"/>
  <path d="M 64 27 C 78 27, 83 19, 80 13 C 74 15, 68 20, 64 27 Z" fill="url(#mzPetal)" stroke="#047857" stroke-width="1"/>
  <!-- Mid Lotus Petals -->
  <path d="M 64 27 C 54 24, 52 13, 56 8 C 61 11, 63 18, 64 27 Z" fill="url(#mzPetal)" stroke="url(#mzGold)" stroke-width="1"/>
  <path d="M 64 27 C 74 24, 76 13, 72 8 C 67 11, 65 18, 64 27 Z" fill="url(#mzPetal)" stroke="url(#mzGold)" stroke-width="1"/>
  <!-- Center Sovereign Lotus Petal -->
  <path d="M 64 27 C 58 20, 58 10, 64 4 C 70 10, 70 20, 64 27 Z" fill="#ecfdf5" stroke="url(#mzGold)" stroke-width="1.2"/>
  <circle cx="64" cy="18" r="2.2" fill="url(#mzGold)"/>
  <!-- Golden kintsugi dewdrops -->
  <circle cx="19" cy="26" r="1.6" fill="#d97706"/>
  <circle cx="109" cy="26" r="1.6" fill="#d97706"/>
  <circle cx="64" cy="2.2" r="1.2" fill="#f59e0b"/>
</svg>
